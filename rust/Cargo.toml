[package]
name = "rust_lib_zanzibarr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes = "0.8.4"
cbc = "0.1.2"
crc32fast = "1.5.0"
flutter_rust_bridge = "=2.12.0"
hmac = "0.12.1"
once_cell = "1.21.4"
quick-xml = "0.41.0"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "1.0.8"
zesven = { version = "1.1.0", default-features = false, features = ["aes", "lzma"] }
zeroize = "1.8.2"
md5 = "0.8"
# Sıkıştırılmış RAR setlerinin çözümü: resmî C++ unrar'ın Rust bağları.
# Yalnız okuma/çıkarma (unrar lisansı sıkıştırma yaratılmasını yasaklar —
# zaten yalnızca çözüyoruz).
# Vendor notu: 0.5.8 kaynağına UCM_CHANGEVOLUME/UCM_PROCESSDATA null
# korumaları eklendi (çok ciltli setlerde SIGABRT/UB'yi önler).
unrar = { path = "../vendor/unrar-rs" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# macOS 26+ (dyld) / rustc strip hatası geçici çözümü: release profilinde
# proc-macro dylib'leri strip edilince LINKEDIT string pool hizası bozuluyor
# ve dyld "mis-aligned LINKEDIT string pool" ile dlopen'i reddediyor
# (rust-lang/rust#157750). Host tarafı build-script/proc-macro derlemesini
# debuginfo'lu bırakmak strip'i atlatır; üretilen sürüm ikililerinin
# optimizasyonunu etkilemez.
[profile.release.build-override]
debug = 2
codegen-units = 256

[dev-dependencies]
tokio = { version = "1.52.4", features = ["macros", "rt-multi-thread"] }
