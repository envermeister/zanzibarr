name: Linux build

# Yalnızca elle tetiklenir; diğer platform workflow'larıyla aynı düzen.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Yerel geliştirme sürümüyle aynı Flutter (pubspec.lock üretimiyle uyum).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true

      # cargokit, Rust motorunu host toolchain ile derler.
      - uses: dtolnay/rust-toolchain@stable

      # Flutter masaüstü + media_kit (sistem libmpv) + secure storage
      # bağımlılıkları. media_kit_libs_linux PkgConfig::mpv ile bağlanır.
      - name: Sistem bağımlılıkları
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libgl1-mesa-dev \
            libsecret-1-dev libmpv-dev

      - name: flutter pub get
        run: flutter pub get

      - name: flutter build linux (release)
        run: flutter build linux --release

      - name: Paketle (tar.gz)
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/zanzibarr-linux-x64.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: zanzibarr-linux-x64
          path: zanzibarr-linux-x64.tar.gz
          retention-days: 14
